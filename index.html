<style>
  :root{
    --violet-50:#f5f3ff;
    --violet-100:#ede9fe;
    --violet-200:#ddd6fe;
    --violet-300:#c4b5fd;
    --violet-400:#a78bfa;
    --violet-500:#8b5cf6;
    --violet-600:#7c3aed;
    --violet-700:#6d28d9;
    --violet-800:#5b21b6;
    --violet-900:#4c1d95;
    --text-light:#f4f1ff;
    --danger:#f87171;
    --success:#34d399;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top left, var(--violet-700), var(--violet-900) 70%);
    color:var(--text-light);
    padding:20px;
  }

  .app{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    border-radius:20px;
    padding:36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    position:relative;
    overflow:hidden;
  }

  .app::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:180px; height:180px;
    background:var(--violet-400);
    filter:blur(70px);
    opacity:0.5;
    border-radius:50%;
  }

  h1{
    font-size:1.6rem;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:0.5px;
  }

  .subtitle{
    text-align:center;
    font-size:0.85rem;
    color:var(--violet-200);
    margin-bottom:24px;
  }

  .tabs{
    display:flex;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
    padding:4px;
    margin-bottom:24px;
    position:relative;
    z-index:1;
  }

  .tab-btn{
    flex:1;
    padding:10px;
    background:transparent;
    border:none;
    color:var(--violet-200);
    font-size:0.9rem;
    font-weight:600;
    border-radius:9px;
    cursor:pointer;
    transition:all 0.25s ease;
  }

  .tab-btn.active{
    background:var(--violet-500);
    color:#fff;
    box-shadow:0 4px 14px rgba(139,92,246,0.5);
  }

  form{
    display:none;
    flex-direction:column;
    gap:14px;
    position:relative;
    z-index:1;
  }

  form.active{ display:flex; }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  label{
    font-size:0.78rem;
    color:var(--violet-200);
    font-weight:600;
    letter-spacing:0.3px;
  }

  input, select{
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.07);
    color:#fff;
    font-size:0.95rem;
    outline:none;
    transition:border-color 0.2s, background 0.2s;
  }

  select option{
    background:var(--violet-900);
    color:#fff;
  }

  input::placeholder{ color:rgba(244,241,255,0.4); }

  input:focus, select:focus{
    border-color:var(--violet-400);
    background:rgba(255,255,255,0.12);
  }

 
  .role-choice{
    display:flex;
    gap:10px;
  }

  .role-option{
    flex:1;
    position:relative;
  }

  .role-option input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
  }

  .role-option .role-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:14px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.07);
    text-align:center;
    transition:border-color 0.2s, background 0.2s;
    pointer-events:none;
  }
  .role-option .role-card .role-label{ font-size:0.85rem; font-weight:700; }
  .role-option .role-card .role-sub{ font-size:0.68rem; color:var(--violet-200); }

  .role-option input:checked + .role-card{
    border-color:var(--violet-400);
    background:rgba(139,92,246,0.25);
    box-shadow:0 4px 14px rgba(139,92,246,0.35);
  }

  .submit-btn{
    margin-top:8px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--violet-500), var(--violet-700));
    color:#fff;
    font-size:0.95rem;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(124,58,237,0.5);
  }

  .submit-btn:active{ transform:translateY(0); }

  .message{
    margin-top:14px;
    padding:10px 12px;
    border-radius:8px;
    font-size:0.85rem;
    text-align:center;
    display:none;
  }

  .message.show{ display:block; }
  .message.error{ background:rgba(248,113,113,0.15); color:var(--danger); border:1px solid rgba(248,113,113,0.4); }
  .message.success{ background:rgba(52,211,153,0.15); color:var(--success); border:1px solid rgba(52,211,153,0.4); }

  .hint{
    margin-top:18px;
    font-size:0.72rem;
    color:rgba(244,241,255,0.5);
    text-align:center;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Welcome</h1>
  <p class="subtitle">Sign in or create an account</p>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="login">Log In</button>
    <button class="tab-btn" data-tab="register">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="active">
    <div class="field">
      <label for="loginUsername">Username</label>
      <input type="text" id="loginUsername" placeholder="Enter your username" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="submit-btn">Log In</button>
  </form>

  <!-- REGISTER FORM -->
  <form id="registerForm">
    <div class="field">
      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username" required>
    </div>
    <div class="field">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Create a password" required>
    </div>
    <div class="field">
      <label for="regConfirm">Confirm Password</label>
      <input type="password" id="regConfirm" placeholder="Repeat your password" required>
    </div>

    <div class="field">
      <label>I am a...</label>
      <div class="role-choice">
        <label class="role-option">
          <input type="radio" name="role" value="student" checked>
          <span class="role-card">
           
            <span class="role-label">Student</span>
            <span class="role-sub">View schedule only</span>
          </span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="teacher">
          <span class="role-card">
           
            <span class="role-label">Teacher</span>
            <span class="role-sub">Can suggest changes</span>
          </span>
        </label>
      </div>
    </div>

    <button type="submit" class="submit-btn">Create Account</button>
  </form>

  <div class="message" id="message"></div>

  <p class="hint">Accounts are stored locally in this browser (localStorage) — no server involved.</p>
</div>

<script>
(function(){
  const STORAGE_KEY = "violet_auth_users";
  const SESSION_KEY = "violet_auth_session";
  const SCHEDULE_PAGE = "classroomschedule.html";

  const tabsEl = document.getElementById('tabs');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const messageEl = document.getElementById('message');

  // ---------- storage helpers ----------
  function getUsers(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveUsers(users){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
  }

  function setSession(username){
    localStorage.setItem(SESSION_KEY, username);
  }

  function getSession(){
    return localStorage.getItem(SESSION_KEY);
  }

  // Very simple hash so plain-text passwords aren't sitting directly in storage.
  // NOTE: this is NOT secure cryptography — fine for a local demo, not for production auth.
  function simpleHash(str){
    let hash = 0;
    for(let i=0; i<str.length; i++){
      const chr = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + chr;
      hash |= 0;
    }
    return hash.toString(36);
  }

  // ---------- UI helpers ----------
  function showMessage(text, type){
    messageEl.textContent = text;
    messageEl.className = 'message show ' + type;
    setTimeout(()=>{ messageEl.classList.remove('show'); }, 3500);
  }

  function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    loginForm.classList.toggle('active', tab === 'login');
    registerForm.classList.toggle('active', tab === 'register');
  }

  tabsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab-btn');
    if(!btn) return;
    switchTab(btn.dataset.tab);
  });

  function goToSchedule(){
    window.location.href = SCHEDULE_PAGE;
  }

  // ---------- register ----------
  registerForm.addEventListener('submit', function(e){
    e.preventDefault();

    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    const roleInput = registerForm.querySelector('input[name="role"]:checked');
    const role = roleInput ? roleInput.value : 'student';

    if(!username || !email || !password){
      showMessage('Please fill in all fields.', 'error');
      return;
    }
    if(password !== confirm){
      showMessage('Passwords do not match.', 'error');
      return;
    }
    if(password.length < 4){
      showMessage('Password should be at least 4 characters.', 'error');
      return;
    }

    const users = getUsers();
    const exists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
    if(exists){
      showMessage('That username is already taken.', 'error');
      return;
    }

    users.push({
      username: username,
      email: email,
      passwordHash: simpleHash(password),
      role: role,
      createdAt: new Date().toISOString()
    });
    saveUsers(users);

    showMessage('Account created! You can log in now.', 'success');
    registerForm.reset();
    switchTab('login');
    document.getElementById('loginUsername').value = username;
  });

  // ---------- login ----------
  loginForm.addEventListener('submit', function(e){
    e.preventDefault();

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    const users = getUsers();
    const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if(!user || user.passwordHash !== simpleHash(password)){
      showMessage('Invalid username or password.', 'error');
      return;
    }

    setSession(user.username);
    showMessage('Welcome back, ' + user.username + '!', 'success');
    loginForm.reset();
    goToSchedule();
  });

  // ---------- restore session on load ----------
  (function init(){
    const sessionUsername = getSession();
    if(sessionUsername){
      const users = getUsers();
      const user = users.find(u => u.username === sessionUsername);
      if(user){
        goToSchedule();
        return;
      }
    }
    switchTab('login');
  })();

})();
</script>

</body>
</html>
